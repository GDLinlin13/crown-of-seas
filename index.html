<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crown of Seas: Chess TD</title>
<meta name="theme-color" content="#0A1A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chess TD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--sea:#0A1628;--panel:#13213d;--line:rgba(255,215,0,.35);--gold:#FFD700;--gold2:#ffe98a;--crimson:#e8304a;--ink:#f2f6ff;--muted:#9db0d6;--good:#7be36b;
  --display:"Bangers",Impact,"Arial Black",sans-serif;--body:"Nunito",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0A1628}
body{font-family:var(--body);color:var(--ink);font-size:14px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:radial-gradient(circle at 50% 0,#16294d,#0A1628 60%,#0A1628);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:540px) and (min-height:700px){#app{height:min(100%,960px);top:50%;transform:translateY(-50%);border-radius:22px;box-shadow:0 0 0 2px #c99a2e,0 30px 80px rgba(0,0,0,.7)}}
.hidden{display:none!important}
.otl{font-family:var(--display);letter-spacing:1px;color:#fff;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 3px 0 #000}
.topbar{display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.topbar .who{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid var(--gold);background:#132d63}
.topbar b{font-family:var(--display);font-size:17px;letter-spacing:1px;display:block;line-height:1}
.topbar small{color:var(--muted);font-size:11px;font-weight:800}
.cur{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;font-weight:900;font-size:13px;white-space:nowrap}
.ic{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:900;flex-shrink:0}
.ic.coin{background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc83d 55%,#c98a00);color:#6b4500}
.ic.gem{background:linear-gradient(135deg,#9ff3ff,#4aa3ff 50%,#7a4dff);border-radius:4px;transform:rotate(45deg) scale(.8)}
.ic.shard{background:linear-gradient(135deg,#ffd0f0,#ff6fb5 50%,#b65cff);border-radius:3px;transform:rotate(45deg) scale(.72)}
.ic.gold{background:radial-gradient(circle at 35% 30%,#fff6c2,#ffb800 55%,#a86a00);color:#3a2200}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{display:none;padding:0 12px 18px}.screen.on{display:block}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#081a3d,#050f26);border-top:2px solid #c99a2e;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:14px;letter-spacing:1px;padding:7px 0 9px;display:grid;justify-items:center;gap:1px}
nav.tabs button.on{color:var(--gold)}
nav.tabs svg{width:24px;height:24px}
.btn{font-family:var(--display);letter-spacing:1px;font-size:19px;border:0;border-radius:14px;padding:9px 16px 8px;color:#3a2200;background:linear-gradient(180deg,#ffe78f,#ffb800);box-shadow:0 4px 0 #a86a00,0 8px 16px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #a86a00}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:not-allowed}
.btn.red{background:linear-gradient(180deg,#ff6b7f,#c81d38);color:#fff;box-shadow:0 4px 0 #7a0f20,0 8px 16px rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(180deg,#5cb3ff,#1d5fd0);color:#fff;box-shadow:0 4px 0 #0f347a,0 8px 16px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.on{background:var(--good);color:#0b2a10}
.btn.sm{font-size:15px;padding:6px 11px 5px;border-radius:11px}
.btn.wide{width:100%}
.h1{font-family:var(--display);font-size:30px;letter-spacing:1.5px;margin:6px 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.h2{font-family:var(--display);font-size:21px;letter-spacing:1px;margin:0 0 6px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.card{background:linear-gradient(180deg,rgba(26,62,128,.92),rgba(12,32,74,.92));border:1px solid #2f5aa0;border-radius:16px;padding:12px}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
/* home */
.scene{position:relative;margin:0 -12px;aspect-ratio:3/2;overflow:hidden}
.scene .bg{position:absolute;inset:0;background:url(assets/home.webp) center/cover no-repeat}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,#0e2350)}
.scene .tag{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:2;font-size:30px;white-space:nowrap}
.scenebtns{position:absolute;left:12px;right:12px;bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:2}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode{position:relative;border:1px solid #2f5aa0;border-radius:16px;padding:12px;text-align:left;background:linear-gradient(135deg,rgba(26,62,128,.95),rgba(10,28,66,.95));min-height:72px;overflow:hidden}
.mode b{font-family:var(--display);font-size:20px;letter-spacing:1px;display:block;line-height:1}
.mode small{color:var(--muted);font-size:11.5px;display:block;margin-top:3px}
/* crews + heroes */
.crewgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crewtile{position:relative;border-radius:14px;border:2px solid var(--cc);background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 35%,#0a1a3a),#0a1530);padding:8px;display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;text-align:left;min-height:70px}
.crewtile img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid var(--cc);background:#0a1226}
.crewtile b{font-family:var(--display);font-size:16px;letter-spacing:.5px;line-height:1.05;display:block}
.crewtile small{font-size:11px;color:var(--muted);font-weight:800}
.crewtile.locked{filter:grayscale(.85) brightness(.6)}
.crewtile .lk{position:absolute;top:6px;right:8px;font-size:15px}
.crewtile.pick{align-content:start}
.crewtile .buffs{grid-column:1/-1;display:grid;gap:3px;font-size:11px;line-height:1.3;font-weight:700;color:#e6ecf7}
.crewtile .buffs em{font-style:normal;font-size:10.5px;font-weight:900;color:var(--gold)}
.crewtile .buffs>span{display:grid;grid-template-columns:18px 1fr;gap:5px;align-items:start;opacity:.5}
.crewtile .buffs>span.ok{opacity:1}
.crewtile .buffs b{font-family:inherit;font-size:10px;letter-spacing:0;line-height:15px;text-align:center;border-radius:5px;background:#06102a;color:#cfd8e6}
.crewtile .buffs .ok b{background:var(--gold);color:#3a2200}
.crewtile.pick{border-color:rgba(255,255,255,.14)!important}
.crewtile.pick img{border-color:rgba(255,255,255,.28)}
.crewtile.pick.sel img{border-color:var(--sc)}
.crewtile.sel{border-color:var(--sc)!important;box-shadow:0 0 0 3px var(--sc),0 0 18px color-mix(in srgb,var(--sc) 55%,transparent)!important}
.crewtile .num{position:absolute;top:-8px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#3a2200;font-weight:900;display:grid;place-items:center;font-size:13px}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hc{position:relative;width:100%;display:block;border-radius:11px;overflow:hidden;aspect-ratio:3/4;border:2.5px solid var(--rc);background:#0a1226;padding:0}
.hc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 2px 2px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .cost{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:13px;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffb800 55%,#a86a00);color:#3a2200;box-shadow:0 1px 2px #000}
.hc .cap{position:absolute;top:2px;right:2px;font-size:9px;font-weight:900;background:var(--gold);color:#3a2200;border-radius:5px;padding:0 4px}
/* rarity label on every card */
.hc .rtag{position:absolute;left:0;right:0;bottom:17px;z-index:2;text-align:center;font-size:8.5px;line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--rar);text-shadow:0 1px 2px #000,0 0 3px #000,0 0 3px #000}
.hc .nm{padding-top:16px!important}
.hc .starrow{bottom:26px!important}
.hc .chk{position:absolute;inset:0;background:rgba(123,227,107,.25);box-shadow:inset 0 0 0 3px var(--good)}
.hc .chk::after{content:"✓";position:absolute;top:2px;right:4px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.hc.off{filter:grayscale(.7) brightness(.55)}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.statgrid div{background:rgba(0,0,0,.28);border-radius:10px;padding:5px 7px}
.statgrid small{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}
.statgrid b{font-family:var(--display);font-size:18px;letter-spacing:1px}
.pill{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor}
.steps{display:flex;gap:6px;margin:4px 0 10px}
.steps span{flex:1;text-align:center;font-size:11px;font-weight:900;padding:5px;border-radius:9px;background:rgba(0,0,0,.3);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--gold);color:#3a2200}
.crewtabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.crewtabs button{flex-shrink:0;border:2px solid var(--cc);background:rgba(0,0,0,.3);border-radius:10px;padding:5px 8px;font-size:11px;font-weight:900}
.crewtabs button.on{background:var(--cc);color:#0a1226}
.quest{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb800,#ffe48a)}
/* battle */
#battle{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 30%,#14306a,#0A1A3A 70%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bhud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(180deg,#16326b,#0A1A3A);border-bottom:2px solid #c99a2e}
.bx{width:34px;height:32px;border-radius:10px;border:1.5px solid #c99a2e;background:#0A1A3A;color:#ffe48a;font-weight:900;padding:0;flex-shrink:0;font-size:13px}
.bx.on{background:var(--gold);color:#3a2200}
.wave{font-size:18px;white-space:nowrap}
.basehp{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.basehp .hpb{flex:1;height:13px;border-radius:8px;background:#06102a;border:2px solid #c99a2e;overflow:hidden}
.basehp .hpb i{display:block;height:100%;background:linear-gradient(90deg,#ffb800,#ffe48a 50%,#4aa3ff);transition:width .25s}
.goldbox{display:flex;align-items:center;gap:3px;font-size:19px}
#lockbar{margin:5px 8px 0;border-radius:10px;padding:4px 10px;font-weight:900;font-size:12px;text-align:center;border:2px dashed var(--line);color:var(--muted)}
#lockbar.locked{border-style:solid;color:#0a1226;background:var(--lc)}
#synbar{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin:5px 8px 0;font-size:11.5px;font-weight:800}
#synbar .sb{position:relative;height:12px;border-radius:7px;background:#06102a;border:1.5px solid var(--line)}
#synbar .sb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--lc,#ffb800),#ffe48a)}
#synbar .mk{position:absolute;top:-3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#132d63;border:1.5px solid var(--line);font-size:9px;display:grid;place-items:center;color:var(--muted)}
#synbar .mk.lit{background:var(--gold);color:#3a2200;border-color:#fff;box-shadow:0 0 6px var(--gold)}
#synbar .txt{grid-column:1/-1;color:var(--muted);font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#synbar .txt b{color:var(--gold)}
.bfield{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 6px}
#bcv{display:block;border-radius:12px;touch-action:none;box-shadow:0 0 0 2px #c99a2e,0 8px 24px rgba(0,0,0,.5)}
.ctrls{display:flex;gap:6px;padding:0 8px 5px;align-items:center}
.ctrls .btn{font-size:14px;padding:6px 9px 5px;white-space:nowrap}
.ctrls .grow{flex:1}
.shop,.bench{display:grid;gap:5px;padding:0 8px 6px}
.shop{grid-template-columns:repeat(5,1fr)}
.bench{grid-template-columns:repeat(6,1fr);border-top:2px solid #c99a2e;padding-top:6px;background:rgba(0,0,0,.25)}
.shop .hc.poor{filter:grayscale(.8) brightness(.55)}
.shop .hc.merge{box-shadow:0 0 0 2px #fff,0 0 12px #ffe48a}
.shop .hc.sold{visibility:hidden}
.bench .slot{aspect-ratio:3/4;border-radius:10px;border:2px dashed var(--line);background:rgba(0,0,0,.2)}
.bench .hc{touch-action:none}
.bench .hc.sel{box-shadow:0 0 0 3px var(--good)}
.bench .hc.wrong::after{content:"LOCKED OUT";position:absolute;top:40%;left:0;right:0;text-align:center;font-size:8px;font-weight:900;background:rgba(232,48,74,.85)}
.st2{box-shadow:0 0 0 2px #dfe8f5}.st3{box-shadow:0 0 0 2px #ffcf3d,0 0 10px #ffcf3d}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;background:linear-gradient(180deg,#183a7a,#0c2250);border:2px solid #c99a2e;border-radius:16px;padding:10px;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#ghost{position:absolute;z-index:60;width:56px;height:56px;pointer-events:none;border-radius:50%;overflow:hidden;transform:translate(-50%,-70%);border:3px solid var(--gold);opacity:.9}
#ghost img{width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;z-index:50;background:rgba(2,6,15,.8);display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:100%;max-width:420px;max-height:92%;overflow:auto;background:linear-gradient(180deg,#14397e,#0a1f4a);border:2px solid #c99a2e;border-radius:20px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dmgrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;margin:4px 0;font-size:12px;font-weight:800}
.dmgrow img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 15%}
.dmgrow .bar{margin:0}
.crewtile.inactive{filter:grayscale(.75) brightness(.7)}
.hc.unowned{filter:none}
.hc.unowned::after{content:"Summon to unlock";position:absolute;left:0;right:0;top:4px;text-align:center;font-size:8.5px;font-weight:900;color:#cfd8e6;text-transform:uppercase;letter-spacing:.04em}
.gbanner{position:relative;border-radius:18px;overflow:hidden;border:2px solid #c99a2e;min-height:200px}
.gbanner .gbg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,32,.92) 0%,rgba(6,12,32,.55) 55%,rgba(6,12,32,.1)),url(assets/home.webp) 70% 30%/cover}
.gbanner .gtxt{position:relative;padding:14px;max-width:70%}
.gbanner .rates{font-size:11.5px;font-weight:800;color:var(--gold2);margin:8px 0}
.pitybox{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
.pitybox small{color:var(--muted);font-weight:800}
.pullgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pullgrid .btn{font-size:17px}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #a86a00,0 0 0 0 rgba(255,200,61,.7)}50%{box-shadow:0 4px 0 #a86a00,0 0 22px 5px rgba(255,200,61,.55)}}
.shopitem{display:grid;gap:3px;justify-items:center}
.shopitem .sn{font-size:10.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.shopitem .btn{font-size:13px;padding:4px 8px 3px}
#pullfx{position:absolute;inset:0;z-index:55;background:radial-gradient(circle at 50% 40%,#16346f,#02060f 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;overflow:hidden}
#pullfx .rays{position:absolute;left:50%;top:45%;width:1200px;height:1200px;margin:-600px 0 0 -600px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 8deg,transparent 8deg 18deg);animation:spin 14s linear infinite;opacity:0;transition:opacity 1s}
#pullfx.go .rays{opacity:1}
#pullfx .rays.r2{background:repeating-conic-gradient(rgba(182,92,255,.18) 0 8deg,transparent 8deg 18deg)}
#pullfx .rays.r4{background:repeating-conic-gradient(rgba(255,77,109,.36) 0 8deg,transparent 8deg 18deg)}
#pullfx .rays.r3{background:repeating-conic-gradient(rgba(255,200,61,.28) 0 8deg,transparent 8deg 18deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.pgrid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;perspective:900px}
.pgrid.one{grid-template-columns:1fr;width:46%}
.pcard{aspect-ratio:3/4;position:relative}
.pin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,1.3,.4,1);transform:rotateY(180deg)}
#pullfx.go .pin{transform:rotateY(0);transition-delay:var(--d)}
#pullfx.skip .pin{transition-delay:0s!important;transition-duration:.15s}
.pback,.pfront{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px}
.pback{transform:rotateY(180deg);background:linear-gradient(135deg,#1d4fa8,#0a1a3a);border:2.5px solid #c99a2e;display:grid;place-items:center;font-size:30px;color:#ffcf3d}
.pfront .hc{height:100%}
.pcard.rarL .pfront{box-shadow:0 0 0 2px #ffb020,0 0 22px #ffb020}
.pcard.rarM .pfront{box-shadow:0 0 0 2px #ff4d6d,0 0 28px 4px #ff4d6d!important}
.pcard.rarE .pfront{box-shadow:0 0 0 2px #b65cff,0 0 14px #b65cff}
.pcard.isnew .pfront{box-shadow:0 0 0 2px #ffcf3d,0 0 18px rgba(255,207,61,.9)}
.newtag{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:linear-gradient(180deg,#ffe78f,#ffb800);color:#3a2200;font-weight:900;font-size:10px;border-radius:6px;padding:1px 6px;z-index:3;box-shadow:0 0 10px #ffcf3d;white-space:nowrap}
.duptag{position:absolute;left:0;right:0;bottom:32px;text-align:center;font-size:9.5px;font-weight:900;color:#ffd0f0;z-index:3;text-shadow:0 1px 2px #000}
.bfield{position:relative}
#trstack{position:absolute;right:4px;top:4px;display:flex;flex-direction:column;gap:3px;max-height:100%;overflow:hidden;pointer-events:none}
.trico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:rgba(6,12,32,.85);border:2px solid var(--tc);box-shadow:0 0 6px var(--tc)}
.trgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.trcard{position:relative;border-radius:14px;border:3px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 30%,#0a1a3a),#081430);padding:22px 6px 10px;display:grid;justify-items:center;gap:4px;text-align:center;min-height:190px;box-shadow:0 0 14px color-mix(in srgb,var(--tc) 60%,transparent);animation:trin .4s ease both}
.trcard:nth-child(2){animation-delay:.12s}.trcard:nth-child(3){animation-delay:.24s}
.trcard:active{transform:scale(.97)}
.trcard .trtier{position:absolute;top:0;left:0;right:0;font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;background:var(--tc);color:#0a1226;padding:2px 0;border-radius:10px 10px 0 0}
.trcard .tricon{font-size:34px;line-height:1.1}
.trcard b{font-family:var(--display);font-size:16px;letter-spacing:.5px;line-height:1.05}
.trcard small{font-size:11px;color:var(--muted);font-weight:800;line-height:1.3}
.trcard.tL{background:linear-gradient(160deg,#5a3a00,#a8261c 60%,#2a0a08);animation:trin .4s ease both,relicglow 1.4s ease-in-out infinite alternate}
.trcard.tL small{color:#ffe8b0}
@keyframes trin{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes relicglow{from{box-shadow:0 0 12px #ffcf3d}to{box-shadow:0 0 28px 6px #ff7a2a}}
#relicfx{position:absolute;inset:0;z-index:58;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(255,220,120,.95),rgba(255,140,40,.6) 45%,rgba(0,0,0,0) 75%);animation:relic 1.8s ease forwards}
#relicfx div{font-size:38px;color:#fff6c2;text-align:center}
@keyframes relic{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
/* ===== premium theme ===== */
.card,.mode,.modal,.crewtile,.gbanner,.pitybox{border-radius:16px!important;border:1px solid rgba(255,215,0,.45)!important;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.card,.mode{background:linear-gradient(180deg,rgba(28,46,84,.95),rgba(14,26,52,.95))}
.modal{background:linear-gradient(180deg,#16294d,#0c1a35)}
.btn.gold{background:linear-gradient(180deg,#ffe98a,#FFD700 55%,#d4a200);color:#3a2600;box-shadow:0 3px 0 #9c7400,0 6px 14px rgba(0,0,0,.35)}
nav.tabs{border-top:1px solid rgba(255,215,0,.5)}
.hc{border-radius:12px!important}
.hc .nm{font-weight:900;color:#fff}
.hc .cost{background:radial-gradient(circle at 35% 30%,#fff6c2,#FFD700 55%,#b8860b)!important}
/* battle HUD */
.bhud{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:6px 8px 0;padding:6px 8px;border-radius:16px;background:linear-gradient(180deg,#16294d,#0e1d38);border:1px solid rgba(255,215,0,.55);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.bhud .hl{display:grid;line-height:1.05}
.bhud .hl .wave{font-size:18px;white-space:nowrap}
.bhud .hl small{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.bhud .hm{display:flex;justify-content:center;gap:6px}
.bhud .stat{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 8px 2px 3px;font-weight:900;font-size:13px;color:#FFD700;white-space:nowrap}
.bhud .heart{font-style:normal;color:#ff5d73;font-size:15px;width:18px;text-align:center}
.bhud .hr{display:flex;gap:5px}
.bx{border-radius:12px!important;border:1px solid rgba(255,215,0,.6)!important;background:#0e1d38!important;color:#FFD700!important}
.hpline{height:4px;margin:4px 16px 0;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}
.hpline i{display:block;height:100%;background:linear-gradient(90deg,#ff5d73,#FFD700);transition:width .25s}
.toprow{display:flex;justify-content:center;margin-top:5px}
#lockbar{display:inline-flex!important;align-items:center;gap:5px;margin:0!important;padding:3px 12px!important;border-radius:999px!important;border:1px solid rgba(255,215,0,.6)!important;background:rgba(10,22,40,.9)!important;color:#FFD700!important;font-size:11.5px!important;font-weight:900!important;white-space:nowrap}
#synbar{display:flex!important;gap:5px;margin:5px 8px 0!important;overflow-x:auto;scrollbar-width:none}
.synpill{flex-shrink:0;display:flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:900;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#8f9bb3}
.synpill i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.synpill.on{color:#fff;border-color:#FFD700;background:linear-gradient(180deg,rgba(255,215,0,.22),rgba(255,215,0,.06));box-shadow:0 0 10px rgba(255,215,0,.45)}
.synpill.on em{font-style:normal;color:#FFD700}
.synpill.more{color:#FFD700;border-color:rgba(255,215,0,.5)}
#synfull{margin:5px 8px 0;padding:8px 10px;border-radius:16px;background:rgba(14,26,52,.97);border:1px solid rgba(255,215,0,.45);font-size:11.5px;display:grid;gap:6px;max-height:40vh;overflow:auto}
#synfull .row{gap:6px}
#synfull .dots{display:flex;gap:3px}
#synfull .dots b{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:#13213d;color:#8f9bb3;border:1px solid rgba(255,255,255,.2)}
#synfull .dots b.lit{background:#FFD700;color:#3a2600;border-color:#fff}
.ctrls{gap:6px!important}
.pilltog{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px 5px 5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:12px;color:#c7d0e0}
.pilltog i{width:26px;height:16px;border-radius:999px;background:#2a3a5c;position:relative;transition:background .2s}
.pilltog i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.pilltog.on{border-color:#FFD700;color:#FFD700}
.pilltog.on i{background:#FFD700}
.pilltog.on i::after{left:12px}
.capctr{font-size:11px;font-weight:900;color:#FFD700;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 8px;white-space:nowrap}
.stackx{position:absolute;top:3px;right:3px;z-index:3;background:#FFD700;color:#3a2600;font-weight:900;font-size:11px;border-radius:7px;padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.shop,.bench{background:transparent!important}
.bench{border-top:1px solid rgba(255,215,0,.45)!important}
.pickmsg{margin-top:4px;padding:5px 10px;border-radius:999px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.5);color:#FFD700;font-size:12px;font-weight:900;text-align:center}
.hc.slotc{border-width:3.5px!important;border-color:var(--rc)!important;box-shadow:0 0 8px color-mix(in srgb,var(--rc) 60%,transparent)}
.hc.slotc .cost{box-shadow:0 0 0 2px var(--rar),0 1px 3px #000}
.hc .starrow{position:absolute;left:0;right:0;bottom:15px;text-align:center;color:#FFD700;font-size:11px;letter-spacing:-1px;z-index:2;text-shadow:0 1px 2px #000,0 0 3px #000}
.synpill{border-color:var(--cc)!important}
.synpill i{background:var(--cc)}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:70;background:rgba(0,0,0,.88);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
/* Play screen: PvP card + quest stages */
.pvpcard{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid #ff6a4a;background:linear-gradient(135deg,#4a1020,#1a0c2e);color:#fff;font-family:inherit}
.pvpcard b{font-size:22px;letter-spacing:.5px;display:block}.pvpcard small{color:#ffd2c4;font-weight:800;font-size:12px}
.pvpcard.locked{border-color:var(--line);background:linear-gradient(135deg,#1c2540,#10182c);filter:saturate(.4)}.pvpcard.locked small{color:var(--muted)}
.pvptag{font-family:var(--display);font-size:20px;color:#ffb38f;flex-shrink:0}
.seahd{font-family:var(--display);letter-spacing:1px;color:var(--gold);font-size:17px;margin:10px 0 5px}
.stgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stg{position:relative;display:grid;justify-items:center;gap:1px;padding:8px 2px 6px;border-radius:12px;border:2px solid var(--line);background:#0e1d3c;color:#fff;font-family:inherit}
.stg b{font-family:var(--display);font-size:24px;line-height:1}.stg small{font-size:9px;color:var(--muted);font-weight:800;white-space:nowrap}
.stg.done{border-color:#3ddc84}.stg.next{border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.45)}.stg.locked{opacity:.45}
.stg .marks{display:flex;gap:3px;margin-top:2px}.stg .marks i{font-style:normal;font-size:9px;font-weight:900;padding:0 4px;border-radius:5px;background:#06102a;color:#4d5a78}
.stg .marks i.on{background:#3ddc84;color:#06251a}.stg .marks i.on.h{background:#b65cff;color:#fff}
.diffrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.diff{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:2px solid #3ddc84;background:#0c2a22;color:#fff;font-family:inherit;text-align:center}
.diff b{font-family:var(--display);font-size:22px;letter-spacing:1px}.diff small{font-size:11px;color:var(--muted);font-weight:800}
.diff.hard{border-color:#b65cff;background:#231238}.diff.locked{opacity:.45}
.diff em{font-style:normal;font-size:10.5px;font-weight:900;color:#3a2200;background:var(--gold);border-radius:6px;padding:1px 6px}.diff em.dim{background:#1d2a48;color:var(--muted)}
.firstclr{display:inline-block;margin-top:6px;font-weight:900;font-size:12px;color:#3a2200;background:var(--gold);border-radius:8px;padding:2px 10px}
/* PvP rivals bar */
#rivals{display:flex;gap:4px;margin:5px 8px 0;overflow-x:auto;scrollbar-width:none;font-size:10.5px;font-weight:900}
#rivals.hidden{display:none}
#rivals .rvlab{flex-shrink:0;color:#ffb38f;padding:2px 4px}
#rivals .rv{flex-shrink:0;display:flex;gap:4px;align-items:center;padding:2px 7px;border-radius:999px;background:rgba(10,22,40,.9);border:1px solid #3a4a6e;color:#cfd8e6}
#rivals .rv b{color:#ff6a8a}#rivals .rv.me{border-color:var(--gold);color:var(--gold)}#rivals .rv.out{opacity:.4;text-decoration:line-through}
#s-summon .crewtabs{flex-wrap:wrap}
#next1,#go{position:sticky;bottom:6px;z-index:4}
#rotate{display:none}
/* ===== landscape ===== */
@media (orientation:landscape){
  #app{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);width:100%;max-width:min(1440px,225vh);height:100%;max-height:none;top:0;transform:none;border-radius:0}
  nav.tabs{grid-column:1;grid-row:1/3;grid-template-columns:1fr;grid-auto-rows:1fr;width:calc(84px + env(safe-area-inset-left,0px));padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);border-top:0;border-right:1px solid rgba(255,215,0,.5)}
  nav.tabs button{align-content:center;padding:4px 0;font-size:13px}
  nav.tabs button.on{background:rgba(255,215,0,.1)}
  .topbar{grid-column:2;grid-row:1;padding:calc(env(safe-area-inset-top,0px) + 5px) calc(env(safe-area-inset-right,0px) + 14px) 5px 14px}
  .avatar{width:32px;height:32px}
  main{grid-column:2;grid-row:2;padding-right:env(safe-area-inset-right,0px)}
  .screen{padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
  .h1{font-size:26px;margin:2px 0 4px}
  #s-home.on{display:grid;grid-template-columns:min(63%,calc((100vh - 135px)*1.5)) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px 14px}
  main:has(#s-home.on){display:grid;align-content:safe center}
  #s-home>*{margin:0!important}
  .scene{grid-row:1/3;align-self:center;aspect-ratio:auto;overflow:visible}
  .scene::after{display:none}
  .scene .bg{position:static;aspect-ratio:3/2;border-radius:16px}
  .scenebtns{position:static;margin-top:8px}
  #s-home>.tiles{grid-auto-rows:1fr}
  #s-home>.card{padding:9px 11px}
  .tiles .mode{min-height:60px;padding:9px 11px;display:flex;flex-direction:column;justify-content:center}
  .crewgrid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
  .hgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .seas{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  #s-quests.on{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
  #s-quests>.h1,#s-quests>.muted{grid-column:1/-1;margin:0!important}
  #s-quests .quest{margin:0}
  #s-summon.on{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;gap:8px 14px}
  #s-summon>*{margin:0!important}
  #s-summon>.row,#s-summon>.card{grid-column:1/-1}
  #s-summon>.gbanner{grid-row:2/4;min-height:0}
  #s-summon>.pullgrid{align-content:center}
  #s-summon>.pullgrid .btn{padding:14px 6px 12px}
  #overlay{padding:8px calc(env(safe-area-inset-right,0px) + 14px) 8px calc(env(safe-area-inset-left,0px) + 14px)}
  .modal{max-width:640px;max-height:100%;padding:12px 16px}
  .trcard{min-height:150px}
  .dmgs{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .pgrid{grid-template-columns:repeat(10,1fr)}
  .pgrid.one{width:min(46%,34vh)}
  #toast{top:48px}
  /* battle: board on the left, everything you tap on the right */
  #battle{--pw:clamp(270px,40%,470px);display:grid;grid-template-columns:minmax(0,1fr) var(--pw);grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto auto auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bhud{grid-column:1/-1;grid-row:1;margin:4px 8px 0;padding:3px 10px;border-radius:12px}
  .bhud .hl{display:flex;align-items:baseline;gap:8px}
  .hpline{grid-column:1/-1;grid-row:2;margin-top:3px}
  .bfield{grid-column:1;grid-row:3/10;min-width:0;contain:size;margin:5px 4px 5px 8px}
  .toprow{grid-column:2;grid-row:3;margin-top:5px;min-width:0}
  #rivals{grid-column:2;grid-row:4;margin:4px 8px 0 4px;min-width:0}
  #synbar{grid-column:2;grid-row:5;margin:4px 8px 0 4px!important;min-width:0}
  #synfull{position:absolute;z-index:6;top:44px;left:calc(env(safe-area-inset-left,0px) + 4px);right:calc(var(--pw) + env(safe-area-inset-right,0px));max-height:calc(100% - 56px)}
  .ctrls{grid-column:2;grid-row:7;padding:4px 8px 5px 4px;min-width:0;flex-wrap:wrap}
  .ctrls .btn{font-size:13px;padding:6px 8px 5px}
  .ctrls .grow{display:none}
  .ctrls .capctr{margin-left:auto}
  #b-next{flex:1 1 100%}
  .pilltog{padding:4px 8px 4px 4px}
  .shop{grid-column:2;grid-row:8;padding:0 8px 5px 4px;min-width:0}
  .bench{grid-column:2;grid-row:9;padding:5px 8px 6px 4px;min-width:0}
  .shop .nm,.bench .nm{font-size:10px}
  #sheet{left:auto;right:calc(env(safe-area-inset-right,0px) + 8px);width:calc(var(--pw) - 12px);max-height:calc(100% - 56px);overflow:auto}
}
@media (orientation:landscape) and (min-height:620px){
  nav.tabs{width:108px}nav.tabs svg{width:32px;height:32px}nav.tabs button{font-size:17px}
  .avatar{width:40px;height:40px}
  .crewgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .hgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .crewtile .buffs{font-size:12px}
  .mode b{font-size:24px}.mode small{font-size:13px}.tiles .mode{min-height:90px}
  .stg{padding:12px 2px 10px}.stg b{font-size:28px}.stg small{font-size:10.5px}
  .trcard{min-height:190px}
  #battle{--pw:clamp(300px,36%,500px)}
  .bhud{padding:7px 12px}.bhud .stat{font-size:15px}
  .ctrls .btn{font-size:16px;padding:8px 12px 7px}
  .shop .nm,.bench .nm{font-size:11px}
}
/* phone held upright: ask to rotate (can be skipped) */
@media (orientation:portrait) and (max-width:600px) and (pointer:coarse){
  body:not(.upright) #rotate{position:absolute;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 40%,#16346f,#060d1c 75%)}
  #rotate i{width:54px;height:92px;border:4px solid var(--gold);border-radius:12px;animation:turn 2.4s ease-in-out infinite}
}
@keyframes turn{0%,25%{transform:none}60%,100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){#rotate i{animation:none!important;transform:rotate(90deg)}}
</style>

<body>
